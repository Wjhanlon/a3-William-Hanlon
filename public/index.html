<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Stack+Sans+Notch:wght@200..700&display=swap" rel="stylesheet">

    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <div class = 'form' >
      <h1>Equipment Request Form</h1>
      <form id = 'requestForm' method='POST' action='/data'>
        <input type='hidden' id='request-id' value='' />

        <label for='equipment'>Equipment Needed: </label>
        <input type='text' id='equipment' required />

        <label for='name'>Requester: </label>
        <input type='text' id='name' required />

        <label for='quantity'>Quantity: </label>
        <input type='number' id='quantity' required />

        <label for='urgent'>Mark if Urgent:</label>
        <input type='checkbox' id='urgent' />

        <label for='date'>Date Needed By:</label>
        <input type="date" id='date' required />

        <label for='notes'>Notes or Other Information:</label>
        <textarea id='notes' rows="3" placeholder="..."></textarea>

        <input type='reset' value='Clear Fields' />
        <input type='submit' value='Add Request' />
        <input type='button' value='Cancel Edit' id='cancel' hidden />
    </form>
    </div>
    <div class = 'results' >
      <p>Items Requested</p>
      <table id='results-table'>
        <thead>
          <tr>
            <th>Equipment</th>
            <th>Requester</th>
            <th>Quantity</th>
            <th>Urgent</th>
            <th>Date Needed</th>
            <th>Notes</th>
            <th>Priority</th>
            <th></th>
          </tr>
        </thead>
        <tbody id='results-body'>
        </tbody>
      </table>
    </div>

  </body>
</html>
